name: Check library size

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  check_lib_size:
    uses: ./.github/workflows/check-size-reusable.yml
    with:
      mode: library
      bypass_label: lib-bloat-ok
      artifact_name: lib-size-check-results
