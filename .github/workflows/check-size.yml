name: Check binary size

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  check_size:
    uses: ./.github/workflows/check-size-reusable.yml
    with:
      mode: binary
      bypass_label: bloat-ok
      artifact_name: size-check-results
