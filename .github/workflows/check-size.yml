name: Check binary size

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  check_size:
    runs-on: ubuntu-latest
    env:
      # Use the same compiler for the base and merged PR builds.
      GOTOOLCHAIN: local
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MERGE_SHA: ${{ github.sha }}
    # Check if pull request does not have label "bloat-ok".
    if: "!contains(github.event.pull_request.labels.*.name, 'bloat-ok')"
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Save PR context
      env:
        EVENT_JSON: ${{ toJSON(github.event) }}
      run: |
        mkdir -p artifacts
        printenv EVENT_JSON > artifacts/event.json
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Compare base and merged PR binary sizes
      id: size-check
      shell: bash
      run: |
        test/check-size.sh "$MERGE_SHA" "$HEAD_SHA" 2>&1 | tee artifacts/output.txt
    - name: Generate size check comment
      if: ${{ failure() && steps.size-check.outcome == 'failure' }}
      env:
        SIZE_RESULT: ${{ steps.size-check.outputs.result }}
      run: |
        {
        cat << 'EOF'
        ## Binary Size Check Failed

        EOF
        if [ "$SIZE_RESULT" = over_limit ]; then
          cat << 'EOF'
        The binary size increase exceeds the allowed threshold.
        EOF
        else
          cat << 'EOF'
        The binary size comparison could not be completed. Inspect the output
        below for the build or revision error.
        EOF
        fi
        cat << 'EOF'

        ### Size Check Output
        ```
        EOF
        cat artifacts/output.txt
        cat << 'EOF'
        ```
        EOF
        if [ "$SIZE_RESULT" = over_limit ]; then
          cat << 'EOF'

        ### How to resolve

        If this size increase is expected and acceptable, a maintainer can add
        the `bloat-ok` label to this PR to bypass the size check.
        EOF
        fi
        cat << 'EOF'

        ---
        *Binary size check performed by CI*
        EOF
        } > artifacts/comment.md
    - name: Upload size check results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: size-check-results
        retention-days: 5
        path: artifacts/
